name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check every js file
        run: |
          set -e
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f"
          done < <(find js -type f -name '*.js' -print | sort)

  smoke:
    name: Headless gameplay regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the game
        run: python3 -m http.server 8741 &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:8741 || sleep 3
      - name: Run smoke test
        run: node scripts/smoke-test.mjs
      - name: Run resource and queued-order regressions
        run: node scripts/performance-regression-test.mjs
      - name: Run command panel and projectile rendering regressions
        run: |
          node scripts/tactical-hud-test.mjs
          node scripts/tracer-fx-test.mjs
          node scripts/impact-fx-test.mjs
          node scripts/scenery-test.mjs
      - name: Run tactical behavior regressions
        run: node scripts/tactical-behavior-test.mjs
      - name: Run supporting fire and infantry visibility regressions
        run: |
          node scripts/infantry-actions-test.mjs
          node scripts/squad-coordination-test.mjs
          node scripts/infantry-asset-test.mjs
          node scripts/supporting-fire-test.mjs
          node scripts/mortar-fire-test.mjs
          node scripts/infantry-locomotion-test.mjs
          node scripts/infantry-visibility-test.mjs
      - name: Run model weapon regressions
        run: |
          node scripts/model-coverage-test.mjs
          node scripts/army-material-test.mjs
          node scripts/fieldgun-model-test.mjs
          node scripts/model-weapon-audit.mjs --assert --no-images
          node scripts/weapon-actors-test.mjs
      - name: Run battle-selector regressions
        run: |
          node scripts/battle-selector-test.mjs
          node scripts/mokra-mission-test.mjs
      - name: Run transport movement regressions
        run: |
          node scripts/transport-movement-test.mjs
          node scripts/transport-clearance-test.mjs
          node scripts/transport-smoothness-test.mjs
          node scripts/transport-waypoint-test.mjs
          node scripts/transport-boarding-test.mjs moving
